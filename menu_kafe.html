<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Меню кофейни с заказом — демо</title>
<style>
:root{--g:#1f5a45;--g2:#e8f3ee;--ink:#1c2a25;--bg:#fbfaf6;--line:#e3e8e2;--acc:#d9822b;--mut:#6a7a73}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
.demo{background:#fff3cd;border:1px solid #f1d98a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
header{padding:14px 0 6px}h1{font-size:28px;margin:0;color:var(--g)}header p{margin:2px 0;color:var(--mut)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{white-space:nowrap;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.it b{font-weight:600}.it small{color:var(--mut)}.pr{font-weight:700}
.ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.ctl .add{width:auto;padding:0 14px;background:var(--g2);color:var(--g);font-size:15px;font-weight:700;border-color:var(--g2)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px}
.bar button{display:block;width:100%;max-width:560px;margin:0 auto;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:17px;font-family:inherit;cursor:pointer}
.bar button:disabled{background:#c9cfcb}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,480px);max-height:88vh}
dialog::backdrop{background:#0006}dialog h2{margin:0 0 8px}
.ln{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:6px 0}
.row2{display:flex;gap:8px}.row2 button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer}.row2 .ok{background:var(--g);color:#fff;border-color:var(--g)}
#box{white-space:pre-wrap;background:#f1f4f2;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;display:none}
</style></head><body><div class="wrap">
<div class="demo" id="demo" hidden>Демо-проект. Кофейня вымышленная, цены условные. Заказ не отправляется, пока не указан Telegram в CONFIG.</div>
<header><h1 id="ttl"></h1><p id="sub"></p></header><div class="tabs" id="tabs"></div><div id="menu"></div></div>
<div class="bar"><button id="cart" disabled>Корзина пуста</button></div>
<dialog id="dlg"><h2>Ваш заказ</h2><div id="lines"></div><hr><div class="ln"><b>Итого</b><b id="tot"></b></div>
<input id="nm" placeholder="Имя"><select id="where"><option>Здесь, за столиком</option><option>С собой</option></select>
<input id="tb" placeholder="Номер столика или время самовывоза"><div class="row2"><button id="cl">Назад</button><button class="ok" id="ok">Отправить заказ</button></div><div id="box"></div></dialog>
<script>
// ===== НАСТРОЙКИ ПОД КЛИЕНТА =====
const CONFIG={name:"Кофейня «Мята»",slogan:"Демо-меню для заказа с телефона",telegram:"[ник_клиента_без_@]",
 menu:{"Кофе":[["Эспрессо","30 мл",120],["Капучино","250 мл",190],["Латте","300 мл",210],["Раф ванильный","300 мл",250]],
 "Чай":[["Чай чёрный","400 мл",140],["Чай облепиховый","400 мл",190],["Матча-латте","300 мл",260]],
 "Десерты":[["Чизкейк","120 г",230],["Круассан с миндалём","90 г",170],["Брауни","100 г",160]],
 "Завтраки":[["Сырники со сметаной","3 шт",290],["Омлет с зеленью","220 г",270],["Сэндвич с лососем","210 г",340]]}};
// =================================
const $=id=>document.getElementById(id);const cart={};let tab=Object.keys(CONFIG.menu)[0];
const fmt=n=>n.toLocaleString("ru-RU")+" ₽";
if(CONFIG.telegram.includes("["))$("demo").hidden=false;$("ttl").textContent=CONFIG.name;$("sub").textContent=CONFIG.slogan;
function tabs(){$("tabs").innerHTML=Object.keys(CONFIG.menu).map(k=>`<button class="${k===tab?"on":""}" data-k="${k}">${k}</button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;tabs();menu()})}
function menu(){$("menu").innerHTML=CONFIG.menu[tab].map((m,i)=>{const id=tab+"|"+i,q=cart[id]||0;
 return `<div class="it"><div><b>${m[0]}</b><br><small>${m[1]}</small></div><div class="pr">${fmt(m[2])}</div><div></div>
 <div class="ctl">${q?`<button data-d="-1" data-id="${id}">−</button><b>${q}</b><button data-d="1" data-id="${id}">+</button>`:`<button class="add" data-d="1" data-id="${id}">Добавить</button>`}</div></div>`}).join("");
 $("menu").querySelectorAll("button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+ +b.dataset.d);if(!cart[id])delete cart[id];menu();bar()})}
function items(){return Object.entries(cart).map(([id,q])=>{const [c,i]=id.split("|");const m=CONFIG.menu[c][+i];return {n:m[0],q,s:m[2]*q}})}
function bar(){const it=items(),t=it.reduce((a,x)=>a+x.s,0),n=it.reduce((a,x)=>a+x.q,0);$("cart").disabled=!n;$("cart").textContent=n?`Корзина: ${n} поз. на ${fmt(t)}`:"Корзина пуста"}
$("cart").onclick=()=>{const it=items();$("lines").innerHTML=it.map(x=>`<div class="ln"><span>${x.n} × ${x.q}</span><span>${fmt(x.s)}</span></div>`).join("");$("tot").textContent=fmt(it.reduce((a,x)=>a+x.s,0));$("box").style.display="none";$("dlg").showModal()};
$("cl").onclick=()=>$("dlg").close();
$("ok").onclick=()=>{const nm=$("nm").value.trim();if(nm.length<2){alert("Укажите имя");return}
 const it=items(),t="Новый заказ\nИмя: "+nm+"\n"+$("where").value+(($("tb").value.trim())?": "+$("tb").value.trim():"")+"\n"+it.map(x=>x.n+" × "+x.q+" = "+fmt(x.s)).join("\n")+"\nИтого: "+fmt(it.reduce((a,x)=>a+x.s,0));
 if(CONFIG.telegram.includes("[")){const b=$("box");b.style.display="block";b.textContent="Демо-режим, так заказ придёт на кассу:\n\n"+t;try{navigator.clipboard.writeText(t)}catch(e){}}
 else window.open("https://t.me/"+CONFIG.telegram+"?text="+encodeURIComponent(t),"_blank")};
tabs();menu();bar();
</script></body></html>
