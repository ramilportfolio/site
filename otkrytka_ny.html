<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новогодняя открытка — демо</title>
<style>
:root{--bg:#0b1d3a;--ink:#fff;--acc:#ffd166}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(#0b1d3a,#1a3a6b);color:var(--ink);min-height:100vh;overflow-x:hidden}
canvas#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px;text-align:center}
.demo{background:#3b3320;color:#ffe9a8;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px;text-align:left}
#gift{margin-top:60px}.box{font-size:120px;cursor:pointer;display:inline-block;animation:bob 1.6s infinite ease-in-out;user-select:none}
@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}
h1{font-size:30px;margin:10px 0}.hint{color:#b8c8ee}
#card{display:none;background:#ffffff14;border:1px solid #ffffff33;border-radius:22px;padding:26px 20px;margin-top:40px;backdrop-filter:blur(6px)}
#card h2{color:var(--acc);font-size:32px;margin:0 0 12px}#txt{font-size:19px;min-height:140px;white-space:pre-line}.sign{margin-top:14px;font-weight:700}
.tree{font-size:56px}
.btn{display:inline-block;margin-top:14px;padding:13px 22px;border:0;border-radius:99px;background:var(--acc);color:#2a1a00;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer}
.builder{background:#ffffff14;border:1px solid #ffffff33;border-radius:18px;padding:16px;text-align:left;margin-top:20px}
textarea,input{width:100%;padding:12px;border-radius:10px;border:0;font:inherit;margin:6px 0}textarea{min-height:120px}
.link{display:flex;justify-content:space-between;gap:8px;background:#ffffff14;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;word-break:break-all;align-items:center}.link button{padding:7px 10px;border:0;border-radius:8px;background:var(--acc);font-weight:700;cursor:pointer;flex:none}
.small{font-size:12px;color:#b8c8ee;margin-top:20px}
</style><style>.demo,.demo-bar{display:none!important}</style>
</head><body><canvas id="snow"></canvas><div class="wrap">
<div class="demo" id="demo" hidden>Демо-проект. Компания вымышленная. Откройте с параметром ?to=Имя, чтобы увидеть персональную открытку, или без него, чтобы увидеть конструктор ссылок.</div>
<div id="view"></div></div>
<script>
// ===== НАСТРОЙКИ ПОД КЛИЕНТА =====
const CONFIG={from:"Команда «Север-Строй» (вымышленная)",year:"2027",
 text:"Пусть новый год принесёт спокойные дни, интересные проекты и тёплые вечера с близкими.\nСпасибо, что вы с нами!",
 telegram:"[ник_клиента_без_@]"};
// =================================
const $=id=>document.getElementById(id);const q=new URLSearchParams(location.search);const to=(q.get("to")||"").trim().slice(0,40);
if(CONFIG.telegram.includes("["))$("demo").hidden=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(to){$("view").innerHTML=`<div id="gift"><div class="box" id="bx">🎁</div><h1>Для ${esc(to)}</h1><div class="hint">Нажмите на подарок</div></div><div id="card"><div class="tree">🎄</div><h2>С Новым ${esc(CONFIG.year)} годом, ${esc(to)}!</h2><div id="txt"></div><div class="sign">${esc(CONFIG.from)}</div><button class="btn" id="again">Ещё раз</button></div>`;
 const open=()=>{$("gift").style.display="none";$("card").style.display="block";type(CONFIG.text)};$("bx").onclick=open;$("again").onclick=()=>{$("gift").style.display="block";$("card").style.display="none"};}
else{$("view").innerHTML=`<h1>Конструктор новогодних открыток</h1><div class="hint">Вставьте имена, каждое с новой строки. Получите персональную ссылку для каждого.</div>
 <div class="builder"><textarea id="names" placeholder="Анна&#10;Игорь&#10;Мария Петровна"></textarea><button class="btn" id="mk">Создать ссылки</button><div id="out"></div><button class="btn" id="all" style="display:none">Скопировать все</button></div>
 <div class="small">Каждая ссылка открывает открытку с именем получателя: можно разослать сотрудникам и клиентам. Страница должна быть опубликована в интернете, чтобы ссылки работали у других.</div>`;
 $("mk").onclick=()=>{const base=location.origin==="null"||location.protocol==="file:"?location.href.split("?")[0]:location.origin+location.pathname;const names=$("names").value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,200);
  $("out").innerHTML=names.map(n=>{const u=base+"?to="+encodeURIComponent(n);return `<div class="link"><span>${esc(n)}: ${esc(u)}</span><button data-u="${esc(u)}">Копировать</button></div>`}).join("");$("all").style.display=names.length?"inline-block":"none";window.__L=names.map(n=>n+": "+base+"?to="+encodeURIComponent(n)).join("\n");
  $("out").querySelectorAll("button").forEach(b=>b.onclick=()=>cp(b.dataset.u))};
 $("all").onclick=()=>cp(window.__L)}
function cp(t){try{navigator.clipboard.writeText(t).then(()=>{},()=>fb(t))}catch(e){fb(t)}}
function fb(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}
function type(s){const el=$("txt");el.textContent="";let i=0;(function n(){if(i<=s.length){el.textContent=s.slice(0,i++);setTimeout(n,28)}})()}
// снег
const cv=$("snow"),c=cv.getContext("2d");let W,H,fl=[];function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<70;i++)fl.push({x:Math.random()*2000,y:Math.random()*1200,r:1+Math.random()*3,v:.5+Math.random()*1.5,s:Math.random()*6});
(function f(){c.clearRect(0,0,W,H);c.fillStyle="#fff";fl.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/40+p.s)*.4;if(p.y>H){p.y=-5;p.x=Math.random()*W}c.globalAlpha=.4+p.r/5;c.beginPath();c.arc(p.x%W,p.y,p.r,0,7);c.fill()});requestAnimationFrame(f)})();
</script></body></html>
