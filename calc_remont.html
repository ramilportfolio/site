<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор ремонта — демо</title>
<style>
:root{--ink:#161e2e;--acc:#6a4fd6;--bg:#f4f6fa;--card:#fff;--mut:#5d6881;--line:#dfe5ef}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.demo{background:#fff3cd;border:1px solid #f1d98a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
h1{font-size:26px;margin:8px 0 4px}p.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label.t{display:block;font-weight:600;margin:14px 0 6px}label.t:first-child{margin-top:0}
input[type=number],input[type=text],input[type=tel],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
input[type=range]{width:100%;accent-color:var(--acc)}
.rng{display:flex;justify-content:space-between;align-items:center;gap:10px}
.step{display:flex;align-items:center;gap:8px}.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.ck input{width:22px;height:22px;accent-color:var(--acc)}.ck span{flex:1}.ck small{color:var(--mut)}
.total{background:var(--ink);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.total .sum{font-size:38px;font-weight:800;color:#fff}.total small{opacity:.8}
.line{display:flex;justify-content:space-between;font-size:14px;opacity:.9;padding:2px 0;gap:10px}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:17px;font-family:inherit;cursor:pointer}
#box{white-space:pre-wrap;background:#eef2f8;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;display:none}
.note{font-size:12px;color:var(--mut);margin-top:10px}
</style></head><body><div class="wrap">
<div class="demo" id="demo" hidden>Демо-проект. Фирма вымышленная, цены условные. Заявка не отправляется, пока не указан Telegram в CONFIG.</div>
<h1 id="h1"></h1><p class="sub" id="sub"></p>
<div class="card" id="fields"></div>
<div class="total"><small>Ориентировочная стоимость</small><div class="sum" id="sum">0 ₽</div><div id="lines"></div><div class="line"><span id="termL"></span><b id="term"></b></div></div>
<div class="card"><label class="t">Ваше имя</label><input type="text" id="name" placeholder="Например, Анна"><label class="t">Телефон</label><input type="tel" id="phone" placeholder="+7 ___ ___-__-__">
<button class="main" id="send" style="margin-top:14px">Отправить заявку</button><div id="box"></div>
<div class="note" id="note"></div></div></div>
<script>
// ===== НАСТРОЙКИ ПОД КЛИЕНТА =====
const CONFIG = {
 "title": "Сколько стоит ремонт?",
 "subtitle": "Ориентировочная цена за 30 секунд (вымышленная компания «Новый дом»)",
 "telegram": "[ник_клиента_без_@]",
 "base": 0,
 "min": 50000,
 "termLabel": "Срок работ",
 "termRule": "(S.area>70?'от 50 дней':S.area>40?'от 35 дней':'от 20 дней')",
 "note": "Точную смету составит мастер после замера. Расчёт не является офертой. Цены условные.",
 "fields": [
  {
   "id": "area",
   "type": "number",
   "label": "Площадь",
   "unit": "м²",
   "min": 20,
   "max": 150,
   "def": 50,
   "step": 5
  },
  {
   "id": "kind",
   "type": "select",
   "label": "Тип ремонта",
   "per": "area",
   "options": [
    {
     "n": "Косметический",
     "p": 3500
    },
    {
     "n": "Капитальный",
     "p": 6500
    },
    {
     "n": "Дизайнерский",
     "p": 9500
    }
   ]
  },
  {
   "id": "el",
   "type": "check",
   "label": "Электрика под ключ",
   "price": 25000
  },
  {
   "id": "pl",
   "type": "check",
   "label": "Сантехника под ключ",
   "price": 18000
  },
  {
   "id": "dem",
   "type": "check",
   "label": "Демонтаж старых покрытий",
   "price": 12000
  },
  {
   "id": "trash",
   "type": "check",
   "label": "Вывоз мусора",
   "price": 6000
  }
 ]
};
// =================================
const $=id=>document.getElementById(id);const S={};
const fmt=n=>Math.round(n).toLocaleString("ru-RU").replace(/ /g," ")+" ₽";
const demo=CONFIG.telegram.includes("[");if(demo)$("demo").hidden=false;
$("h1").textContent=CONFIG.title;$("sub").textContent=CONFIG.subtitle;$("note").textContent=CONFIG.note;$("termL").textContent=CONFIG.termLabel||"Срок";
CONFIG.fields.forEach(f=>{S[f.id]=f.type==="check"?false:f.type==="select"?0:f.def;});
function build(){const box=$("fields");box.innerHTML="";let checks=null;
 CONFIG.fields.forEach(f=>{
  if(f.type==="number"){const l=document.createElement("div");l.innerHTML=`<label class="t">${f.label}: <b id="o_${f.id}"></b> ${f.unit||""}</label>`+(f.step&&f.max-f.min>12?`<input type="range" id="i_${f.id}" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.def}">`:`<div class="rng"><span></span><div class="step"><button data-id="${f.id}" data-d="-${f.step||1}">−</button><b id="s_${f.id}"></b><button data-id="${f.id}" data-d="${f.step||1}">+</button></div></div>`);box.appendChild(l);checks=null}
  else if(f.type==="select"){const l=document.createElement("div");l.innerHTML=`<label class="t">${f.label}</label><select id="i_${f.id}">${f.options.map((o,i)=>`<option value="${i}">${o.n}</option>`).join("")}</select>`;box.appendChild(l);checks=null}
  else{if(!checks){checks=document.createElement("div");checks.style.marginTop="12px";box.appendChild(checks)}
   const d=document.createElement("label");d.className="ck";d.innerHTML=`<input type="checkbox" id="i_${f.id}"><span>${f.label}</span><small>${f.price?"+"+fmt(f.price):""}</small>`;checks.appendChild(d)}});
 box.querySelectorAll("input[type=range]").forEach(r=>r.oninput=()=>{S[r.id.slice(2)]=+r.value;calc()});
 box.querySelectorAll("select").forEach(s=>s.onchange=()=>{S[s.id.slice(2)]=+s.value;calc()});
 box.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{S[c.id.slice(2)]=c.checked;calc()});
 box.querySelectorAll(".step button").forEach(b=>b.onclick=()=>{const f=CONFIG.fields.find(x=>x.id===b.dataset.id);S[f.id]=Math.max(f.min,Math.min(f.max,S[f.id]+ +b.dataset.d));calc()})}
function calc(){let sum=CONFIG.base||0;const rows=[];if(CONFIG.base)rows.push(["Базовая стоимость",CONFIG.base]);
 CONFIG.fields.forEach(f=>{
  if(f.type==="number"){const o=$("o_"+f.id);if(o)o.textContent=S[f.id];const s=$("s_"+f.id);if(s)s.textContent=S[f.id];
   if(f.price){const v=f.price*S[f.id]*(f.times?S[f.times]:1);sum+=v;rows.push([f.label+": "+S[f.id]+" "+(f.unit||"")+(f.times?" × "+S[f.times]:""),v])}}
  else if(f.type==="select"){const o=f.options[S[f.id]];const v=o.p*(f.per?S[f.per]:1);if(v){sum+=v;rows.push([f.label+": "+o.n,v])}else rows.push([f.label+": "+o.n,0])}
  else if(S[f.id]){sum+=f.price;rows.push([f.label,f.price])}});
 if(CONFIG.min&&sum<CONFIG.min){rows.push(["Минимальный заказ",CONFIG.min-sum]);sum=CONFIG.min}
 $("lines").innerHTML=rows.map(r=>`<div class="line"><span>${r[0]}</span><span>${r[1]?fmt(r[1]):"входит"}</span></div>`).join("");
 $("sum").textContent=fmt(sum);$("term").textContent=CONFIG.term?CONFIG.term(S):"";S.__sum=sum;S.__rows=rows}
CONFIG.term=CONFIG.termRule?new Function("S","return "+CONFIG.termRule):null;
$("send").onclick=()=>{const n=$("name").value.trim(),p=$("phone").value.trim();
 if(n.length<2||p.replace(/\D/g,"").length<10){alert("Укажите имя и телефон (не меньше 10 цифр)");return}
 const t="Заявка: "+CONFIG.title+"\nИмя: "+n+"\nТелефон: "+p+"\n"+S.__rows.map(r=>r[0]+(r[1]?": "+fmt(r[1]):"")).join("\n")+"\nИтого: "+fmt(S.__sum);
 if(demo){const b=$("box");b.style.display="block";b.textContent="Демо-режим, так заявка придёт вам:\n\n"+t;try{navigator.clipboard.writeText(t)}catch(e){}}
 else window.open("https://t.me/"+CONFIG.telegram+"?text="+encodeURIComponent(t),"_blank")};
build();calc();
</script></body></html>
